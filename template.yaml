AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  bw-api

  Sample SAM Template for bw-api

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    MemorySize: 128

Resources:
  BWAPIFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: bw-api/
      Handler: app.lambda_handler
      Runtime: python3.12
      FunctionName: assetRetrieval-bwAPI
      Architectures:
        - x86_64
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*_bw_api_key-*"
      Events:
        BWAPI:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /api/{identifier}
            Method: get

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  BWAPIEndpointURL:
    Description: "API Gateway endpoint URL for the Prod stage of the bw-api function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/api/"
  BWAPIFunctionArn:
    Description: "ARN of the bw-api Lambda function"
    Value: !GetAtt BWAPIFunction.Arn
  BWAPIFunctionRoleArn:
    Description: "ARN of the implicit IAM role created for the bw-api Lambda function"
    Value: !GetAtt BWAPIFunctionRole.Arn
